<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>領収書仕訳システム</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4A90E2;
            --primary-dark: #2E5BBA;
            --success: #4CAF50;
            --warning: #FF9800;
            --danger: #F44336;
            --bg-light: #F5F7FA;
            --bg-white: #FFFFFF;
            --text-dark: #333333;
            --text-light: #666666;
            --border-color: #E0E0E0;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid white;
        }

        .user-name {
            font-size: 0.9rem;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-google {
            background-color: white;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-color);
        }

        .btn-google:hover {
            background-color: #f5f5f5;
        }

        .btn-logout {
            background-color: transparent;
            color: white;
            border: 1px solid white;
            padding: 8px 16px;
        }

        .btn-logout:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn-success:hover {
            background-color: #43A047;
        }

        .btn-warning {
            background-color: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background-color: #F57C00;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: #D32F2F;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 48px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .login-card h2 {
            margin-bottom: 16px;
            color: var(--text-dark);
        }

        .login-card p {
            color: var(--text-light);
            margin-bottom: 32px;
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Upload Section */
        .upload-section {
            background: white;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .upload-section h2 {
            margin-bottom: 24px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 48px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--primary);
            background-color: rgba(74, 144, 226, 0.05);
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .upload-text {
            color: var(--text-light);
            margin-bottom: 16px;
        }

        .upload-text strong {
            color: var(--primary);
        }

        .file-preview {
            margin-top: 24px;
            display: none;
        }

        .file-preview.show {
            display: block;
        }

        .preview-image {
            max-width: 300px;
            max-height: 200px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .file-name {
            color: var(--text-dark);
            margin-bottom: 16px;
        }

        .upload-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        /* Result Section */
        .result-section {
            background: white;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-section h2 {
            margin-bottom: 24px;
            color: var(--text-dark);
        }

        .journal-card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .journal-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 12px;
        }

        .journal-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .journal-field label {
            font-size: 0.8rem;
            color: var(--text-light);
            font-weight: 500;
        }

        .journal-field input,
        .journal-field select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .journal-field input:focus,
        .journal-field select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .result-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        /* Journals List */
        .journals-section {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow);
        }

        .journals-section h2 {
            margin-bottom: 24px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .journals-table {
            width: 100%;
            border-collapse: collapse;
        }

        .journals-table th,
        .journals-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .journals-table th {
            background-color: var(--bg-light);
            font-weight: 600;
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .journals-table tr:hover {
            background-color: rgba(74, 144, 226, 0.05);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-pending {
            background-color: #FFF3E0;
            color: #E65100;
        }

        .status-confirmed {
            background-color: #E8F5E9;
            color: #2E7D32;
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--text-light);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 24px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            box-shadow: var(--shadow);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            background-color: var(--success);
        }

        .toast.error {
            background-color: var(--danger);
        }

        .toast.warning {
            background-color: var(--warning);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h3 {
            margin: 0;
            color: var(--text-dark);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-light);
        }

        .modal-body {
            padding: 24px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-label {
            font-weight: 500;
            color: var(--text-light);
        }

        .detail-value {
            color: var(--text-dark);
            text-align: right;
            word-break: break-all;
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            gap: 12px;
        }

        .journals-table tr {
            cursor: pointer;
        }

        /* File Queue */
        .queue-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .queue-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-light);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .queue-item.processing {
            border-color: var(--primary);
            background: rgba(74, 144, 226, 0.1);
        }

        .queue-item.done {
            border-color: var(--success);
            background: rgba(76, 175, 80, 0.1);
        }

        .queue-item-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }

        .queue-item-info {
            flex: 1;
        }

        .queue-item-name {
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .queue-item-status {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .queue-item-status.pending { color: var(--warning); }
        .queue-item-status.processing { color: var(--primary); }
        .queue-item-status.done { color: var(--success); }

        .queue-item-remove {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px;
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .journal-row {
                grid-template-columns: 1fr;
            }

            .upload-actions,
            .result-actions {
                flex-direction: column;
            }

            .journals-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>領収書仕訳システム</h1>
        <div class="user-info" id="userInfo">
            <!-- Dynamic content -->
        </div>
    </header>

    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h2>ようこそ</h2>
            <p>Googleアカウントでログインして<br>領収書の仕訳を始めましょう</p>
            <button class="btn btn-google" id="loginBtn">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Googleでログイン
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container hidden" id="mainContent">
        <!-- Upload Section -->
        <section class="upload-section">
            <h2>領収書をアップロード</h2>
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept="image/*,.pdf" multiple>
                <div class="upload-icon">📄</div>
                <p class="upload-text">
                    ファイルをドラッグ&ドロップ<br>
                    または<strong>クリックして選択</strong>
                </p>
                <p style="font-size: 0.85rem; color: #999;">対応形式: JPG, PNG, PDF（複数選択可）</p>
            </div>
            <!-- ファイルキュー -->
            <div class="file-queue" id="fileQueue" style="display: none;">
                <h3 style="margin: 24px 0 16px; color: var(--text-dark);">アップロードキュー <span id="queueCount"></span></h3>
                <div class="queue-list" id="queueList"></div>
                <div class="upload-actions" style="margin-top: 16px;">
                    <button class="btn btn-primary" id="processAllBtn">すべて処理開始</button>
                    <button class="btn btn-primary" id="addMoreBtn" style="background: var(--success);">+ ファイルを追加</button>
                    <button class="btn" style="background: #eee; color: #666;" id="clearAllBtn">すべてクリア</button>
                </div>
            </div>
            <!-- 現在処理中のファイル -->
            <div class="file-preview" id="filePreview">
                <h3 style="margin-bottom: 16px; color: var(--text-dark);">処理中: <span id="currentFileName"></span></h3>
                <img class="preview-image" id="previewImage" src="" alt="プレビュー">
            </div>
            <div class="loading" id="uploadLoading">
                <div class="spinner"></div>
                <p>領収書を解析中...</p>
            </div>
        </section>

        <!-- Result Section -->
        <section class="result-section" id="resultSection">
            <h2>仕訳結果</h2>
            <div class="journal-card" id="journalCard">
                <div class="journal-row">
                    <div class="journal-field">
                        <label>日付</label>
                        <input type="date" id="journalDate">
                    </div>
                    <div class="journal-field">
                        <label>金額</label>
                        <input type="number" id="journalAmount" placeholder="0">
                    </div>
                    <div class="journal-field">
                        <label>税区分</label>
                        <select id="journalTax">
                            <option value="10">10% (標準税率)</option>
                            <option value="8">8% (軽減税率)</option>
                            <option value="0">非課税</option>
                        </select>
                    </div>
                </div>
                <div class="journal-row">
                    <div class="journal-field">
                        <label>借方科目</label>
                        <select id="journalDebit">
                            <option value="消耗品費">消耗品費</option>
                            <option value="旅費交通費">旅費交通費</option>
                            <option value="交際費">交際費</option>
                            <option value="会議費">会議費</option>
                            <option value="通信費">通信費</option>
                            <option value="水道光熱費">水道光熱費</option>
                            <option value="地代家賃">地代家賃</option>
                            <option value="広告宣伝費">広告宣伝費</option>
                            <option value="福利厚生費">福利厚生費</option>
                            <option value="雑費">雑費</option>
                        </select>
                    </div>
                    <div class="journal-field">
                        <label>貸方科目</label>
                        <select id="journalCredit">
                            <option value="現金">現金</option>
                            <option value="普通預金">普通預金</option>
                            <option value="クレジットカード">クレジットカード</option>
                            <option value="未払金">未払金</option>
                        </select>
                    </div>
                    <div class="journal-field">
                        <label>摘要</label>
                        <input type="text" id="journalDescription" placeholder="取引内容">
                    </div>
                </div>
                <div class="journal-row">
                    <div class="journal-field">
                        <label>登録番号（インボイス）</label>
                        <input type="text" id="journalRegistrationNumber" placeholder="T0000000000000">
                    </div>
                    <div class="journal-field">
                        <!-- 空白 -->
                    </div>
                    <div class="journal-field">
                        <!-- 空白 -->
                    </div>
                </div>
            </div>
            <div class="result-actions">
                <button class="btn" style="background: #eee; color: #666;" id="cancelResultBtn">キャンセル</button>
                <button class="btn btn-success" id="confirmBtn">仕訳を保存</button>
            </div>
            <div class="loading" id="confirmLoading">
                <div class="spinner"></div>
                <p>保存中...</p>
            </div>
        </section>

        <!-- Journals List -->
        <section class="journals-section">
            <h2>
                <span>仕訳一覧</span>
                <button class="btn btn-primary" id="refreshBtn">更新</button>
            </h2>
            <div class="loading" id="listLoading">
                <div class="spinner"></div>
                <p>読み込み中...</p>
            </div>
            <table class="journals-table" id="journalsTable">
                <thead>
                    <tr>
                        <th>日付</th>
                        <th>借方科目</th>
                        <th>貸方科目</th>
                        <th>金額</th>
                        <th>摘要</th>
                        <th>ステータス</th>
                    </tr>
                </thead>
                <tbody id="journalsBody">
                    <!-- Dynamic content -->
                </tbody>
            </table>
            <div class="empty-state hidden" id="emptyState">
                <div class="empty-icon">📋</div>
                <p>まだ仕訳がありません</p>
            </div>
        </section>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 詳細モーダル -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>仕訳詳細</h3>
                <button class="modal-close" onclick="closeDetailModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-row">
                    <span class="detail-label">日付</span>
                    <span class="detail-value" id="detailDate">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">金額</span>
                    <span class="detail-value" id="detailAmount">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">税区分</span>
                    <span class="detail-value" id="detailTax">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">借方科目</span>
                    <span class="detail-value" id="detailDebit">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">貸方科目</span>
                    <span class="detail-value" id="detailCredit">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">摘要</span>
                    <span class="detail-value" id="detailDescription">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">登録番号</span>
                    <span class="detail-value" id="detailRegistration">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">ファイル名</span>
                    <span class="detail-value" id="detailFilename">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">登録日時</span>
                    <span class="detail-value" id="detailCreatedAt">-</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" id="deleteJournalBtn">削除</button>
                <button class="btn btn-primary" onclick="closeDetailModal()">閉じる</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (with Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ===========================================
        // Firebase Configuration
        // ===========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCJ7jodABNonR_L_X0UHoYHRoeozd2WJpQ",
            authDomain: "receipt-journal-bb6aa.firebaseapp.com",
            projectId: "receipt-journal-bb6aa",
            storageBucket: "receipt-journal-bb6aa.firebasestorage.app",
            messagingSenderId: "6271979198",
            appId: "1:6271979198:web:b49f0497cf282b4ff118ef"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===========================================
        // State
        // ===========================================
        let currentUser = null;
        let fileQueue = []; // { file, status: 'pending'|'processing'|'done', dataUrl }
        let currentProcessingIndex = -1;
        let journalsData = []; // 仕訳一覧データを保持
        let selectedJournalId = null; // 選択中の仕訳ID

        // ===========================================
        // DOM Elements
        // ===========================================
        const loginScreen = document.getElementById('loginScreen');
        const mainContent = document.getElementById('mainContent');
        const userInfo = document.getElementById('userInfo');
        const loginBtn = document.getElementById('loginBtn');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileQueueEl = document.getElementById('fileQueue');
        const queueList = document.getElementById('queueList');
        const queueCount = document.getElementById('queueCount');
        const processAllBtn = document.getElementById('processAllBtn');
        const addMoreBtn = document.getElementById('addMoreBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const filePreview = document.getElementById('filePreview');
        const previewImage = document.getElementById('previewImage');
        const currentFileName = document.getElementById('currentFileName');
        const uploadLoading = document.getElementById('uploadLoading');
        const resultSection = document.getElementById('resultSection');
        const confirmBtn = document.getElementById('confirmBtn');
        const cancelResultBtn = document.getElementById('cancelResultBtn');
        const confirmLoading = document.getElementById('confirmLoading');
        const refreshBtn = document.getElementById('refreshBtn');
        const journalsBody = document.getElementById('journalsBody');
        const journalsTable = document.getElementById('journalsTable');
        const emptyState = document.getElementById('emptyState');
        const listLoading = document.getElementById('listLoading');
        const toast = document.getElementById('toast');
        const detailModal = document.getElementById('detailModal');
        const deleteJournalBtn = document.getElementById('deleteJournalBtn');

        // ===========================================
        // Auth Functions
        // ===========================================

        // Auth state listener
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                showMainContent();
                loadJournals();
            } else {
                currentUser = null;
                showLoginScreen();
            }
        });

        // Google login - ポップアップを試し、失敗したらリダイレクト
        loginBtn.addEventListener('click', async () => {
            const provider = new firebase.auth.GoogleAuthProvider();

            try {
                // まずポップアップを試す
                await auth.signInWithPopup(provider);
                showToast('ログインしました', 'success');
            } catch (error) {
                console.error('Popup login error:', error);

                // ポップアップがブロックされた場合はリダイレクトを試す
                if (error.code === 'auth/popup-blocked' ||
                    error.code === 'auth/popup-closed-by-user' ||
                    error.code === 'auth/cancelled-popup-request') {
                    try {
                        await auth.signInWithRedirect(provider);
                    } catch (redirectError) {
                        console.error('Redirect login error:', redirectError);
                        showToast('ログインに失敗しました', 'error');
                    }
                } else {
                    showToast('ログインに失敗しました: ' + error.message, 'error');
                }
            }
        });

        // リダイレクト後の結果を処理（リダイレクト認証使用時）
        auth.getRedirectResult().then((result) => {
            if (result.user) {
                showToast('ログインしました', 'success');
            }
        }).catch((error) => {
            if (error.code && error.code !== 'auth/credential-already-in-use') {
                console.error('Redirect result error:', error);
            }
        });

        // Logout
        async function logout() {
            try {
                await auth.signOut();
                showToast('ログアウトしました', 'success');
            } catch (error) {
                console.error('Logout error:', error);
                showToast('ログアウトに失敗しました', 'error');
            }
        }

        // ===========================================
        // UI Functions
        // ===========================================

        function showLoginScreen() {
            loginScreen.classList.remove('hidden');
            mainContent.classList.add('hidden');
            userInfo.innerHTML = '';
        }

        function showMainContent() {
            loginScreen.classList.add('hidden');
            mainContent.classList.remove('hidden');

            // Update user info in header
            userInfo.innerHTML = `
                <img class="user-avatar" src="${currentUser.photoURL || 'https://via.placeholder.com/40'}" alt="avatar">
                <span class="user-name">${currentUser.displayName || currentUser.email}</span>
                <button class="btn btn-logout" onclick="logout()">ログアウト</button>
            `;
        }

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('ja-JP', {
                style: 'currency',
                currency: 'JPY'
            }).format(amount);
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('ja-JP');
        }

        // ===========================================
        // File Upload Functions (複数ファイル対応)
        // ===========================================

        // Click to upload
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                handleFiles(files);
            }
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files);
            if (files.length > 0) {
                handleFiles(files);
            }
        });

        // 複数ファイルを処理
        async function handleFiles(files) {
            const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'application/pdf'];

            for (const file of files) {
                // Validate file type
                if (!validTypes.includes(file.type)) {
                    showToast(`${file.name}: 対応していないファイル形式です`, 'error');
                    continue;
                }

                // Validate file size (max 10MB)
                if (file.size > 10 * 1024 * 1024) {
                    showToast(`${file.name}: ファイルサイズが大きすぎます`, 'error');
                    continue;
                }

                // 画像のDataURLを取得
                let dataUrl = null;
                if (file.type.startsWith('image/')) {
                    dataUrl = await readFileAsDataURL(file);
                }

                // キューに追加
                fileQueue.push({
                    file: file,
                    status: 'pending',
                    dataUrl: dataUrl
                });
            }

            fileInput.value = '';
            updateQueueDisplay();
            showToast(`${files.length}件のファイルをキューに追加しました`, 'success');
        }

        // ファイルをDataURLとして読み込む
        function readFileAsDataURL(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        // キュー表示を更新
        function updateQueueDisplay() {
            if (fileQueue.length === 0) {
                fileQueueEl.style.display = 'none';
                return;
            }

            fileQueueEl.style.display = 'block';
            queueCount.textContent = `(${fileQueue.length}件)`;

            queueList.innerHTML = fileQueue.map((item, index) => `
                <div class="queue-item ${item.status}" data-index="${index}">
                    ${item.dataUrl
                        ? `<img class="queue-item-thumb" src="${item.dataUrl}" alt="">`
                        : `<div class="queue-item-thumb" style="background: #eee; display: flex; align-items: center; justify-content: center;">PDF</div>`
                    }
                    <div class="queue-item-info">
                        <div class="queue-item-name">${item.file.name}</div>
                        <div class="queue-item-status ${item.status}">
                            ${item.status === 'pending' ? '待機中' :
                              item.status === 'processing' ? '処理中...' : '完了'}
                        </div>
                    </div>
                    ${item.status === 'pending' ?
                        `<button class="queue-item-remove" onclick="removeFromQueue(${index})">×</button>` : ''}
                </div>
            `).join('');
        }

        // キューから削除
        function removeFromQueue(index) {
            fileQueue.splice(index, 1);
            updateQueueDisplay();
        }

        // ファイルを追加
        addMoreBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // すべてクリア
        clearAllBtn.addEventListener('click', () => {
            fileQueue = [];
            currentProcessingIndex = -1;
            filePreview.classList.remove('show');
            resultSection.classList.remove('show');
            updateQueueDisplay();
            showToast('キューをクリアしました', 'success');
        });

        // すべて処理開始
        processAllBtn.addEventListener('click', () => {
            processNextInQueue();
        });

        // ===========================================
        // Google Cloud Vision OCR
        // ===========================================
        const VISION_API_KEY = 'AIzaSyBbF7J2nZn5L1_QtLK0os3Em1CZ9YWZf_E';
        const VISION_API_URL = `https://vision.googleapis.com/v1/images:annotate?key=${VISION_API_KEY}`;

        // Cloud Vision APIでOCR実行
        async function performOCR(dataUrl) {
            // DataURLからbase64部分を抽出
            const base64Image = dataUrl.split(',')[1];

            const requestBody = {
                requests: [{
                    image: { content: base64Image },
                    features: [{ type: 'TEXT_DETECTION', maxResults: 1 }]
                }]
            };

            const response = await fetch(VISION_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                throw new Error(`Vision API error: ${response.status}`);
            }

            const result = await response.json();
            const textAnnotations = result.responses[0]?.textAnnotations;

            if (!textAnnotations || textAnnotations.length === 0) {
                return null;
            }

            // 全文テキストを取得
            const fullText = textAnnotations[0].description;
            return parseReceiptText(fullText);
        }

        // 領収書テキストから情報を抽出
        function parseReceiptText(text) {
            const lines = text.split('\n');
            const result = {
                date: '',
                amount: 0,
                tax_rate: 10,
                debit_account: '消耗品費',
                credit_account: '現金',
                description: '',
                vendor_name: '',
                registration_number: ''
            };

            // 日付パターン（様々な形式に対応）
            const datePatterns = [
                /(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/,  // 2024/01/15, 2024-01-15, 2024年1月15日
                /令和\s*(\d+)\s*年\s*(\d+)\s*月\s*(\d+)/,     // 令和6年1月15日
                /R(\d+)[\.\/](\d+)[\.\/](\d+)/,               // R6.1.15
            ];

            // 金額パターン
            const amountPatterns = [
                /合計[^\d]*[¥￥]?\s*([\d,]+)/i,
                /総額[^\d]*[¥￥]?\s*([\d,]+)/i,
                /計[^\d]*[¥￥]?\s*([\d,]+)/i,
                /[¥￥]\s*([\d,]+)/,
                /(\d{1,3}(?:,\d{3})+)円/,
                /(\d+)円/
            ];

            // 登録番号パターン（インボイス）
            const registrationPattern = /T\d{13}/;

            // 税率パターン
            const taxPatterns = [
                /軽減.*8\s*%/i,
                /8\s*%.*対象/i,
                /\*.*8%/
            ];

            // テキスト全体を解析
            const fullText = text;

            // 日付抽出
            for (const pattern of datePatterns) {
                const match = fullText.match(pattern);
                if (match) {
                    if (pattern.toString().includes('令和')) {
                        const year = 2018 + parseInt(match[1]);
                        result.date = `${year}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')}`;
                    } else if (pattern.toString().includes('R')) {
                        const year = 2018 + parseInt(match[1]);
                        result.date = `${year}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')}`;
                    } else {
                        result.date = `${match[1]}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')}`;
                    }
                    break;
                }
            }

            // 日付が取得できなかった場合は今日の日付
            if (!result.date) {
                result.date = new Date().toISOString().split('T')[0];
            }

            // 金額抽出（最も大きい金額を合計とみなす）
            let maxAmount = 0;
            for (const pattern of amountPatterns) {
                const matches = fullText.matchAll(new RegExp(pattern, 'gi'));
                for (const match of matches) {
                    const amount = parseInt(match[1].replace(/,/g, ''));
                    if (amount > maxAmount && amount < 10000000) { // 1000万円未満
                        maxAmount = amount;
                    }
                }
            }
            result.amount = maxAmount;

            // 登録番号抽出
            const regMatch = fullText.match(registrationPattern);
            if (regMatch) {
                result.registration_number = regMatch[0];
            }

            // 税率判定（軽減税率のキーワードがあれば8%）
            for (const pattern of taxPatterns) {
                if (pattern.test(fullText)) {
                    result.tax_rate = 8;
                    break;
                }
            }

            // 店舗名抽出（最初の行を店舗名とする）
            if (lines.length > 0) {
                result.vendor_name = lines[0].trim().substring(0, 30);
                result.description = result.vendor_name;
            }

            // 勘定科目推定
            const lowerText = fullText.toLowerCase();
            if (/タクシー|電車|交通|駐車|高速|ＪＲ|jr|バス/.test(lowerText)) {
                result.debit_account = '旅費交通費';
            } else if (/カフェ|コーヒー|会議|ミーティング/.test(lowerText)) {
                result.debit_account = '会議費';
            } else if (/接待|贈答|お祝い|御礼/.test(lowerText)) {
                result.debit_account = '交際費';
            } else if (/電話|通信|インターネット|携帯/.test(lowerText)) {
                result.debit_account = '通信費';
            } else if (/電気|ガス|水道|光熱/.test(lowerText)) {
                result.debit_account = '水道光熱費';
            } else if (/文具|事務|コピー|印刷/.test(lowerText)) {
                result.debit_account = '消耗品費';
            }

            return result;
        }

        // ===========================================
        // キュー処理
        // ===========================================

        // 次のファイルを処理
        async function processNextInQueue() {
            // 待機中のファイルを探す
            const pendingIndex = fileQueue.findIndex(item => item.status === 'pending');

            if (pendingIndex === -1) {
                // 全て完了
                showToast('すべての処理が完了しました', 'success');
                filePreview.classList.remove('show');
                resultSection.classList.remove('show');
                // 完了したアイテムをクリア
                fileQueue = fileQueue.filter(item => item.status !== 'done');
                updateQueueDisplay();
                loadJournals();
                return;
            }

            currentProcessingIndex = pendingIndex;
            const currentItem = fileQueue[pendingIndex];
            currentItem.status = 'processing';
            updateQueueDisplay();

            // プレビュー表示
            filePreview.classList.add('show');
            currentFileName.textContent = currentItem.file.name;
            if (currentItem.dataUrl) {
                previewImage.src = currentItem.dataUrl;
                previewImage.style.display = 'block';
            } else {
                previewImage.style.display = 'none';
            }

            // OCR処理
            uploadLoading.classList.add('show');

            try {
                // Cloud Vision APIでOCR実行
                let ocrResult = null;

                if (currentItem.dataUrl) {
                    ocrResult = await performOCR(currentItem.dataUrl);
                }

                // OCR失敗時はデフォルト値を使用
                if (!ocrResult) {
                    ocrResult = {
                        date: new Date().toISOString().split('T')[0],
                        amount: 0,
                        tax_rate: 10,
                        debit_account: '消耗品費',
                        credit_account: '現金',
                        description: currentItem.file.name,
                        vendor_name: '',
                        registration_number: ''
                    };
                    showToast('テキストを検出できませんでした。手動で入力してください。', 'warning');
                }

                // Fill form with extracted data
                document.getElementById('journalDate').value = ocrResult.date;
                document.getElementById('journalAmount').value = ocrResult.amount;
                document.getElementById('journalTax').value = ocrResult.tax_rate;
                document.getElementById('journalDebit').value = ocrResult.debit_account;
                document.getElementById('journalCredit').value = ocrResult.credit_account;
                document.getElementById('journalDescription').value = ocrResult.description;
                document.getElementById('journalRegistrationNumber').value = ocrResult.registration_number || '';

                // Show result section
                resultSection.classList.add('show');

                if (ocrResult.amount > 0) {
                    showToast('領収書を解析しました', 'success');
                }

            } catch (error) {
                console.error('OCR error:', error);
                showToast('解析に失敗しました', 'error');
                currentItem.status = 'pending';
                updateQueueDisplay();
            } finally {
                uploadLoading.classList.remove('show');
            }
        }

        // Cancel result - スキップして次へ
        cancelResultBtn.addEventListener('click', () => {
            if (currentProcessingIndex >= 0 && fileQueue[currentProcessingIndex]) {
                // スキップしたファイルを削除
                fileQueue.splice(currentProcessingIndex, 1);
                updateQueueDisplay();
            }
            resultSection.classList.remove('show');
            filePreview.classList.remove('show');
            // 次のファイルを処理
            processNextInQueue();
        });

        // Save journal to Firestore
        confirmBtn.addEventListener('click', async () => {
            confirmBtn.disabled = true;
            confirmLoading.classList.add('show');

            try {
                const currentItem = fileQueue[currentProcessingIndex];

                const journalData = {
                    user_id: currentUser.uid,
                    date: document.getElementById('journalDate').value,
                    amount: parseInt(document.getElementById('journalAmount').value) || 0,
                    tax_rate: parseInt(document.getElementById('journalTax').value),
                    debit_account: document.getElementById('journalDebit').value,
                    credit_account: document.getElementById('journalCredit').value,
                    description: document.getElementById('journalDescription').value,
                    registration_number: document.getElementById('journalRegistrationNumber').value || '',
                    status: 'confirmed',
                    receipt_filename: currentItem ? currentItem.file.name : null,
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    updated_at: firebase.firestore.FieldValue.serverTimestamp()
                };

                // Save to Firestore
                await db.collection('journals').add(journalData);

                showToast('仕訳を保存しました', 'success');

                // マーク完了
                if (currentItem) {
                    currentItem.status = 'done';
                    updateQueueDisplay();
                }

                // Reset
                resultSection.classList.remove('show');
                filePreview.classList.remove('show');

                // 次のファイルを処理
                processNextInQueue();

            } catch (error) {
                console.error('Save error:', error);
                showToast('保存に失敗しました: ' + error.message, 'error');
            } finally {
                confirmBtn.disabled = false;
                confirmLoading.classList.remove('show');
            }
        });

        // Load journals from Firestore
        refreshBtn.addEventListener('click', loadJournals);

        async function loadJournals() {
            if (!currentUser) return;

            listLoading.classList.add('show');
            journalsTable.classList.add('hidden');
            emptyState.classList.add('hidden');

            try {
                // Query Firestore for user's journals
                const snapshot = await db.collection('journals')
                    .where('user_id', '==', currentUser.uid)
                    .orderBy('created_at', 'desc')
                    .limit(100)
                    .get();

                const journals = [];
                snapshot.forEach(doc => {
                    journals.push({ id: doc.id, ...doc.data() });
                });

                // データを保存
                journalsData = journals;

                if (journals.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    journalsBody.innerHTML = journals.map(journal => `
                        <tr onclick="showJournalDetail('${journal.id}')">
                            <td>${formatDate(journal.date)}</td>
                            <td>${journal.debit_account || '-'}</td>
                            <td>${journal.credit_account || '-'}</td>
                            <td>${formatCurrency(journal.amount || 0)}</td>
                            <td>${journal.description || '-'}</td>
                            <td>
                                <span class="status-badge ${journal.status === 'confirmed' ? 'status-confirmed' : 'status-pending'}">
                                    ${journal.status === 'confirmed' ? '確定済' : '未確定'}
                                </span>
                            </td>
                        </tr>
                    `).join('');
                    journalsTable.classList.remove('hidden');
                }

            } catch (error) {
                console.error('Load journals error:', error);
                // インデックス作成が必要な場合のエラーハンドリング
                if (error.code === 'failed-precondition') {
                    showToast('データベースの初期設定中です。しばらくお待ちください。', 'warning');
                    // インデックスなしでも動くように単純なクエリを試す
                    try {
                        const snapshot = await db.collection('journals')
                            .where('user_id', '==', currentUser.uid)
                            .get();

                        const journals = [];
                        snapshot.forEach(doc => {
                            journals.push({ id: doc.id, ...doc.data() });
                        });

                        // 手動でソート
                        journals.sort((a, b) => {
                            const dateA = a.created_at ? a.created_at.toDate() : new Date(0);
                            const dateB = b.created_at ? b.created_at.toDate() : new Date(0);
                            return dateB - dateA;
                        });

                        // データを保存
                        journalsData = journals;

                        if (journals.length === 0) {
                            emptyState.classList.remove('hidden');
                        } else {
                            journalsBody.innerHTML = journals.map(journal => `
                                <tr onclick="showJournalDetail('${journal.id}')">
                                    <td>${formatDate(journal.date)}</td>
                                    <td>${journal.debit_account || '-'}</td>
                                    <td>${journal.credit_account || '-'}</td>
                                    <td>${formatCurrency(journal.amount || 0)}</td>
                                    <td>${journal.description || '-'}</td>
                                    <td>
                                        <span class="status-badge ${journal.status === 'confirmed' ? 'status-confirmed' : 'status-pending'}">
                                            ${journal.status === 'confirmed' ? '確定済' : '未確定'}
                                        </span>
                                    </td>
                                </tr>
                            `).join('');
                            journalsTable.classList.remove('hidden');
                        }
                    } catch (e) {
                        console.error('Fallback query error:', e);
                        emptyState.classList.remove('hidden');
                    }
                } else {
                    showToast('データの取得に失敗しました', 'error');
                    emptyState.classList.remove('hidden');
                }
            } finally {
                listLoading.classList.remove('show');
            }
        }

        // ===========================================
        // 詳細モーダル関連
        // ===========================================

        // 詳細モーダルを表示
        function showJournalDetail(journalId) {
            const journal = journalsData.find(j => j.id === journalId);
            if (!journal) {
                showToast('データが見つかりません', 'error');
                return;
            }

            selectedJournalId = journalId;

            // モーダルに値をセット
            document.getElementById('detailDate').textContent = formatDate(journal.date);
            document.getElementById('detailAmount').textContent = formatCurrency(journal.amount || 0);
            document.getElementById('detailTax').textContent = `${journal.tax_rate || 10}%`;
            document.getElementById('detailDebit').textContent = journal.debit_account || '-';
            document.getElementById('detailCredit').textContent = journal.credit_account || '-';
            document.getElementById('detailDescription').textContent = journal.description || '-';
            document.getElementById('detailRegistration').textContent = journal.registration_number || '-';
            document.getElementById('detailFilename').textContent = journal.receipt_filename || '-';

            // 登録日時
            if (journal.created_at && journal.created_at.toDate) {
                const createdDate = journal.created_at.toDate();
                document.getElementById('detailCreatedAt').textContent = createdDate.toLocaleString('ja-JP');
            } else {
                document.getElementById('detailCreatedAt').textContent = '-';
            }

            // モーダルを表示
            detailModal.classList.add('show');
        }

        // 詳細モーダルを閉じる
        function closeDetailModal() {
            detailModal.classList.remove('show');
            selectedJournalId = null;
        }

        // モーダル外クリックで閉じる
        detailModal.addEventListener('click', (e) => {
            if (e.target === detailModal) {
                closeDetailModal();
            }
        });

        // 仕訳を削除
        deleteJournalBtn.addEventListener('click', async () => {
            if (!selectedJournalId) return;

            if (!confirm('この仕訳を削除しますか？')) {
                return;
            }

            try {
                await db.collection('journals').doc(selectedJournalId).delete();
                showToast('仕訳を削除しました', 'success');
                closeDetailModal();
                loadJournals();
            } catch (error) {
                console.error('Delete error:', error);
                showToast('削除に失敗しました: ' + error.message, 'error');
            }
        });
    </script>
</body>
</html>
